<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INFARLAB - Recuperar Contraseña</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="codigoAuthenticator.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <i class="fa-solid fa-shield-halved"></i>
                <h1>Recuperación 2FA</h1>
                <p>Ingresa el código de Google Authenticator</p>
            </div>

            <div id="alert-recup" class="alert-message hidden"></div>

            <!--COLOCAR EL CORREO-->
            <div id="paso-totp">
                <div class="input-group">
                    <i class="fa-solid fa-envelope"></i>
                    <input 
                        type="email" 
                        id="email-recup" 
                        placeholder="usuario@infarlab.com"
                        pattern="[a-zA-Z0-9._%+\-]+@infarlab\.com$"
                        title="Solo se permiten correos institucionales (@infarlab.com)"
                        required
                    >
                </div>
                <div id="email-error" class="error-text">Solo se permiten correos institucionales (@infarlab.com)</div>

                <div class="input-group">
                    <i class="fa-solid fa-mobile-screen-button"></i>
                    <input type="text" id="codigo-totp" class="codigo-input" placeholder="000000" maxlength="6" inputmode="numeric">
                </div>
                
                <div class="timer" id="timer">El código cambia en: <span id="segundos">30</span>s</div>
                
                <button class="btn-primary" onclick="validarTotp()">
                    <i class="fa-solid fa-check"></i> Verificar Código
                </button>
            </div>

            <!--NUEVA CONTRASEÑA-->
            <div id="paso-nueva-pass" style="display: none;">
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="nueva-pass" placeholder="Nueva contraseña" minlength="6" required>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="confirmar-pass" placeholder="Confirmar contraseña" required>
                </div>
                <button class="btn-primary" onclick="restablecerContrasena()">
                    <i class="fa-solid fa-key"></i> Actualizar Contraseña
                </button>
            </div>

            <div class="auth-footer">
                <a href="index.html" class="forgot-link">Volver al Login</a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = "https://localhost:7067/api";
        let tokenRecuperacion = '';
        let emailUsuario = '';

        //TEMPORIZADOR DE 30S PARA EL CÓDIGO
        let segundos = 30;
        setInterval(() => {
            segundos--;
            if (segundos <= 0) segundos = 30;
            document.getElementById('segundos').textContent = segundos;
        }, 1000);

        async function validarTotp() {
            emailUsuario = document.getElementById('email-recup').value.trim().toLowerCase();
            const codigo = document.getElementById('codigo-totp').value.trim();
            const emailError = document.getElementById('email-error');

            //CAMPO VACÍO
            if (!emailUsuario) {
                emailError.textContent = "El correo es obligatorio";
                emailError.style.display = 'block';
                return;
            }

            //FORMATO DE CORREO
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(emailUsuario)) {
                emailError.textContent = "El correo no tiene un formato válido";
                emailError.style.display = 'block';
                return;
            }

            //SOLO @infarlab.com
            if (!emailUsuario.endsWith('@infarlab.com')) {
                emailError.textContent = "Solo se permiten correos institucionales (@infarlab.com)";
                emailError.style.display = 'block';
                return;
            }

            //CÓDIGO DE 6 DÍGITOS
            if (codigo.length !== 6 || !/^\d{6}$/.test(codigo)) {
                emailError.textContent = "El código debe tener exactamente 6 dígitos";
                emailError.style.display = 'block';
                return;
            }

            //TODO CHILL = NO HAY ERROR
            emailError.style.display = 'none';

            try {
                const response = await fetch(`${API_BASE_URL}/Auth/validar-totp-recuperacion`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailUsuario, codigoTotp: codigo })
                });

                const data = await response.json();
                if (response.ok) {
                    tokenRecuperacion = data.token;
                    document.getElementById('paso-totp').style.display = 'none';
                    document.getElementById('paso-nueva-pass').style.display = 'block';
                } else {
                    alert("❌" + data.mensaje);
                }
            } catch (error) {
                console.error(error);
                alert("Error de conexión con el servidor.");
            }
        }

        async function restablecerContrasena() {
            const nueva = document.getElementById('nueva-pass').value;
            const confirmar = document.getElementById('confirmar-pass').value;

            if (nueva !== confirmar) {
                alert("Las contraseñas no coinciden");
                return;
            }
            if (nueva.length < 6) {
                alert("La contraseña debe tener al menos 6 caracteres");
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/Auth/restablecer-contrasena`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: emailUsuario,
                        token: tokenRecuperacion,
                        nuevaContrasena: nueva,
                        confirmarContrasena: confirmar
                    })
                });

                const data = await response.json();
                if (response.ok) {
                    alert("✅Contraseña actualizada exitosamente. Ahora puedes iniciar sesión.");
                    window.location.href = 'index.html';
                } else {
                    alert("❌" + data.mensaje);
                }
            } catch (error) {
                console.error(error);
                alert("Error de conexión con el servidor.");
            }
        }
    </script>
</body>
</html>
