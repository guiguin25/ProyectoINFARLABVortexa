<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INFARLAB - Restablecer Contraseña</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="auth-body">
 
    <div class="auth-container">
        <div id="reset-card" class="auth-card">
            <div class="auth-header">
                <i class="fa-solid fa-lock-open"></i>
                <h1>Nueva Contraseña</h1>
                <p>Ingrese su nueva contraseña para acceder al sistema</p>
            </div>
 
            <div id="reset-alert" class="alert-message hidden"></div>
 
            <form id="form-reset">
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="new-password" placeholder="Nueva contraseña" required minlength="6">
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="confirm-password" placeholder="Confirmar contraseña" required>
                </div>
 
                <button type="submit" class="btn-primary">Actualizar Contraseña</button>
            </form>

            <div class="auth-footer">
                <a href="index.html" class="forgot-link">Volver al Login</a>
            </div>
        </div>
    </div>
 
    <script>
        const API_BASE_URL = "https://localhost:7067/api";
 
        //TOKEN Y CORREO
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const email = urlParams.get('email');
 
        if (!token || !email) {
            document.getElementById('reset-alert').textContent = "Enlace de recuperación inválido.";
            document.getElementById('reset-alert').className = "alert-message alert-error";
            document.getElementById('reset-alert').classList.remove("hidden");
            document.getElementById('form-reset').style.display = 'none';
        }
 
        document.getElementById('form-reset').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const alertBox = document.getElementById('reset-alert');
 
            if (newPassword !== confirmPassword) {
                alertBox.textContent = "Las contraseñas no coinciden.";
                alertBox.className = "alert-message alert-error";
                alertBox.classList.remove("hidden");
                return;
            }
 
            try {
                const response = await fetch(`${API_BASE_URL}/Auth/reset-password`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        email: email,
                        token: token,
                        nuevaContrasena: newPassword,
                        confirmarContrasena: confirmPassword
                    })
                });
 
                const data = await response.json();
 
                if (response.ok) {
                    alertBox.textContent = "Contraseña actualizada exitosamente. Redirigiendo al login...";
                    alertBox.className = "alert-message alert-success";
                    alertBox.classList.remove("hidden");
                    
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 2000);
                } else {
                    alertBox.textContent = data.mensaje || "Error al actualizar la contraseña.";
                    alertBox.className = "alert-message alert-error";
                    alertBox.classList.remove("hidden");
                }
            } catch (error) {
                console.error("Error:", error);
                alertBox.textContent = "Error de conexión con el servidor.";
                alertBox.className = "alert-message alert-error";
                alertBox.classList.remove("hidden");
            }
        });
    </script>
</body>
</html>
